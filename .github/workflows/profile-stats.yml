# Builds the GitHub activity images shown in README.md and publishes them to the
# `output` branch (a single commit, force-pushed), so `main` stays free of bot commits.
#
#   snake.svg, snake-dark.svg                Platane/snk          contribution-graph snake
#   metrics/calendar.svg, calendar-dark.svg  lowlighter/metrics   isometric contribution calendar
#   metrics/languages.svg, languages-dark.svg  scripts/languages-card.mjs (public repos, REST API)
#
# Everything runs on the built-in GITHUB_TOKEN. Optionally, a classic personal access token
# stored as the repository secret METRICS_TOKEN is used by lowlighter/metrics instead.
# Private contributions appear in the calendar and snake once "Include private contributions
# on my profile" is enabled in the GitHub profile settings.

name: Profile stats

on:
  schedule:
    - cron: "17 17 * * *" # daily, 00:17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-stats.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Keep the previous images, so one failed generator never leaves a broken image.
      - name: Restore previous images
        run: |
          mkdir -p dist/metrics
          if git clone --quiet --depth 1 --branch output "https://github.com/${GITHUB_REPOSITORY}.git" previous; then
            for f in snake.svg snake-dark.svg metrics/calendar.svg metrics/calendar-dark.svg metrics/languages.svg metrics/languages-dark.svg; do
              if [ -f "previous/$f" ]; then cp "previous/$f" "dist/$f"; fi
            done
            rm -rf previous
          fi

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3d6a0c&color_dots=#ebedf0,#d7ec9f,#b2d65c,#78a62a,#3d6a0c
            dist/snake-dark.svg?palette=github-dark&color_snake=#c6ef4e&color_dots=#161b22,#2b3a12,#4d6b17,#86b52a,#c6ef4e

      # No `id:` here: lowlighter/metrics reads the step id to tell whether it is the official
      # action, and a custom id makes it rebuild its Docker image instead of pulling it.
      - name: Contribution calendar
        continue-on-error: true
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: calendar.svg
          output_action: none
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Recolour GitHub's green scale to the portfolio's lime scale, plus a dark-mode copy.
      - name: Calendar colours (light and dark)
        run: |
          if [ -s /metrics_renders/calendar.svg ]; then
            sed -e 's/#9be9a8/#d7ec9f/gI' -e 's/#40c463/#b2d65c/gI' -e 's/#30a14e/#78a62a/gI' -e 's/#216e39/#3d6a0c/gI' \
              /metrics_renders/calendar.svg > dist/metrics/calendar.svg
            sed -e 's/#ebedf0/#161b22/gI' -e 's/#d7ec9f/#2b3a12/gI' -e 's/#b2d65c/#4d6b17/gI' -e 's/#78a62a/#86b52a/gI' -e 's/#3d6a0c/#c6ef4e/gI' \
              dist/metrics/calendar.svg > dist/metrics/calendar-dark.svg
          else
            echo "::warning::The contribution calendar was not refreshed in this run; the previous image is kept."
          fi

      - name: Languages card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/languages-card.mjs "${{ github.repository_owner }}" dist/metrics || echo "::warning::The languages card was not refreshed in this run; the previous image is kept."

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist dist/metrics
          cd dist
          git init --quiet --initial-branch=output
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Update profile stats"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
